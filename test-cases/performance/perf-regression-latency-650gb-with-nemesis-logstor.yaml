test_metadata:
  description: >-
    Logstor variant of the latency-under-operations test: 250M partitions (~260GB) on
    3 x i8g.4xlarge, RF=3 over 3 racks, a logstor table from data_dir/c-s_logstor.yaml
    with the tablet count pinned at 512, so grow and shrink only migrate tablets. Runs
    fixed-rate cassandra-stress write, read and mixed workloads while SisyphusMonkey runs
    a NemesisSequence, and measures latency per step.
  test_type: performance
  tier: release
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  features:
    - tablets
  team_ownership: core-test-infra

test_duration: 840

# 250M partitions: a node that holds a full rack replica keeps the logstor index under half
# of the shard memory (~170 B per record, SCYLLADB-6331).
prepare_write_cmd:
  - "cassandra-stress user profile=/tmp/c-s_logstor.yaml 'ops(write_row=1)' no-warmup cl=ALL n=62500000 -mode cql3 native -rate threads=200 -pop seq=1..62500000"
  - "cassandra-stress user profile=/tmp/c-s_logstor.yaml 'ops(write_row=1)' no-warmup cl=ALL n=62500000 -mode cql3 native -rate threads=200 -pop seq=62500000..125000000"
  - "cassandra-stress user profile=/tmp/c-s_logstor.yaml 'ops(write_row=1)' no-warmup cl=ALL n=62500000 -mode cql3 native -rate threads=200 -pop seq=125000000..187500000"
  - "cassandra-stress user profile=/tmp/c-s_logstor.yaml 'ops(write_row=1)' no-warmup cl=ALL n=62500000 -mode cql3 native -rate threads=200 -pop seq=187500000..250000000"

stress_cmd_w: "cassandra-stress user profile=/tmp/c-s_logstor.yaml 'ops(write_row=1)' no-warmup cl=QUORUM duration=2850m -mode cql3 native -rate 'threads=250 fixed=20332/s' -pop 'dist=gauss(1..250000000,125000000,3750000)'"
stress_cmd_r: "cassandra-stress user profile=/tmp/c-s_logstor.yaml 'ops(read_row=1)' no-warmup cl=QUORUM duration=800m -mode cql3 native -rate 'threads=250 fixed=10310/s' -pop 'dist=gauss(1..250000000,125000000,3750000)'"
stress_cmd_m: "cassandra-stress user profile=/tmp/c-s_logstor.yaml 'ops(write_row=1,read_row=1)' no-warmup cl=QUORUM duration=800m -mode cql3 native -rate 'threads=250 fixed=8750/s' -pop 'dist=gauss(1..250000000,125000000,2500000)'"

n_db_nodes: 3
n_loaders: 4

instance_type_loader: 'c5.2xlarge'
instance_type_monitor: 't3.large'
instance_type_db: 'i3en.2xlarge'

nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: 'NemesisSequence'
nemesis_interval: 30
nemesis_sequence_sleep_between_ops: 10

user_prefix: 'perf-latency-nemesis'
space_node_threshold: 644245094
ami_id_db_scylla_desc: 'VERSION_DESC'

round_robin: true
append_scylla_args: '--blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
backtrace_decoding: true
backtrace_stall_decoding: false

email_recipients: ["scylla-perf-results@scylladb.com"]
use_prepared_loaders: false
use_hdrhistogram: true

cs_extra_jvm_opts: '-XX:+UseZGC -XX:+ZGenerational -Xms8g -Xmx8g -XX:+AlwaysPreTouch'
use_placement_group: true
use_capacity_reservation: true
email_subject_postfix: 'latency during operations'
parallel_node_operations: false  # doing this to align the measurement
cluster_health_check: false
hinted_handoff: 'enabled'
argus_email_report_template: email_report_performance.yaml

adaptive_timeout_store_metrics: false
