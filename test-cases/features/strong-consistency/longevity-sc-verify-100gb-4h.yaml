# Strong consistency verified load (SCYLLADB-4519): a copy of test-cases/longevity/longevity-100gb-4h-cql-stress.yaml
# where only the strong-consistency parts change. The tool and its rules: data_dir/sc_verify/, sdcm/stress/sc_verify_thread.py.
test_duration: 330  # minutes: preload (~30) + 240 load + 10 checker drain + read-back + setup
argus_use_ssh_tunnel: true
test_metadata:
  description: >-
    4-hour longevity on strongly consistent tables: 100 GB of 512 B rows preloaded, then checked
    linearizability plus bulk mixed load on a 6-node, 3-rack cluster with curated
    topology nemesis.
  test_type: longevity
  tier: tier2
  duration_class: short
  supported_backends:
    - aws
  stress_tools:
    - cql-stress-sc-verify
  workload: mixed
  features:
    - tablets
    - strong-consistency
  team_ownership: core-qa

# One replica per rack (RF 3), so a quorum survives any single node down, and topology nemesis
# still leave a node in each rack.
n_db_nodes: 6
simulated_racks: 3
n_loaders: 3
# 32 vCPU and 64 GB: each loader runs the bulk stream, the checked stream and 16 checker workers of 3 GB.
instance_type_loader: 'c6i.8xlarge'
seeds_num: 3
sizing_db:
  vcpu: 8
  memory: '>=64'
root_disk_size_loader: 100  # room for the histories and expected.jsonl
user_prefix: 'longevity-sc-verify-100gb-4h'
space_node_threshold: 64424

experimental_features:
  - strongly-consistent-tables
append_scylla_yaml:
  tablets_mode_for_new_keyspaces: enabled

server_encrypt: true
client_encrypt: false  # the thread does not pass TLS options yet

# Two copies of the tool on the same rows report false violations, so each entry runs on one loader
# (round_robin), there is exactly one stress_cmd entry per loader, and the --pop and --bulk-pop ranges
# don't overlap. The thread checks these rules before it starts.
round_robin: true

# 209,715,200 rows of 512 B of cells (sc-verify-profile-512b.yaml) = 100 GiB, preloaded in three disjoint thirds, one per
# loader.
prepare_write_cmd:
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-512b.yaml --mode bulk --bulk-op write -n 69905067
    --bulk-pop seq=1099511627776..1099581532842 --bulk-threads 80
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-512b.yaml --mode bulk --bulk-op write -n 69905067
    --bulk-pop seq=1099581532843..1099651437909 --bulk-threads 80
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-512b.yaml --mode bulk --bulk-op write -n 69905066
    --bulk-pop seq=1099651437910..1099721342975 --bulk-threads 80

# Loaders 1-2 run only the checked stream (--mode verify); loader 3 runs only the bulk mixed load (--mode bulk) over
# the whole preloaded data. The checked stream follows the research job (configurations/sc_verify/research-1h.yaml):
# 8 clients per row; 32 ops per 100 ms burst, 100 ops per row, 30% reads; the checker gets 120 s per row, 5 rows per
# file (600 s of the 900 s file limit), 16 workers of 3 GB and a canary every 100 files; 16 driver connections per
# shard. --bulk-rate stays at the tool's default (0, unthrottled).
stress_cmd:
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-512b.yaml --mode verify --pop seq=0..1023 --slots 128
    --clients-per-row 8 --burst-ops 32 --burst-interval 100ms --ops-per-gen 100 --read-ratio 0.3 --insert-ratio 0.5
    --key-timeout 120s --check-rows 5 --checker-workers 16 --checker-mem 3G --canary-every 100
    --connections-per-shard 16 --checker-timeout 900s
    --duration 240m
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-512b.yaml --mode verify --pop seq=1024..2047 --slots 128
    --clients-per-row 16 --burst-ops 32 --burst-interval 200ms --ops-per-gen 100 --read-ratio 0.5 --insert-ratio 0.5
    --key-timeout 120s --check-rows 5 --checker-workers 16 --checker-mem 3G --canary-every 100
    --connections-per-shard 16 --checker-timeout 900s
    --duration 240m
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-512b.yaml --mode bulk
    --bulk-op mixed --bulk-read-ratio 0.5 --bulk-pop seq=1099511627776..1099721342975 --bulk-threads 80
    --connections-per-shard 16 --duration 240m

# One thread of ALTER TABLE ... WITH <property> nemeses on the verified table; `not disruptive` drops the TWCS one.
nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: 'modify_table and not disruptive'
nemesis_seed: 32
nemesis_interval: 10  # minutes; leaves room for quiet rows between disruptions
nemesis_during_prepare: false  # the preload must run on a stable cluster
