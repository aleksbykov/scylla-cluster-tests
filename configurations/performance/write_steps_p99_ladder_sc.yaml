# Write steps around the SC P99 = 10 ms knee on 3 x i8g.4xlarge. Since Scylla 2026-11-01 (04a0f07fb36a) every step
# up to 150k passed (P99 9.1 ms at 150k), so the ladder now goes to 300k. Rate-limited steps stay below ~450k, where
# a follower falls behind for good (SCYLLADB-2565). 1,000 threads per loader keep 4,000 requests in flight,
# so at 1,000 threads the 50k step is not comparable with the weekly page (500 threads).
# See docs/plans/mini-plans/2026-10-26-sc-ec-max-write-throughput-p99-10ms.md
perf_gradual_threads: {"write": 1000}
perf_gradual_throttle_steps: {"write": ['50000', '100000', '150000', '175000', '200000', '250000', '300000', 'unthrottled']}
perf_gradual_step_duration: {"write": '15m'}
# Bracket for test_write_max_throughput_under_p99: the ladder ends until Phase 0 narrows it
perf_p99_search: {"target_p99_ms": 10, "low": 150000, "high": 300000, "tolerance": 5000, "probe_duration": '10m', "confirm_duration": '15m'}
