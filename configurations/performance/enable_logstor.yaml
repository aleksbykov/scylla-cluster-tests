experimental_features:
  - logstor

append_scylla_yaml:
  # Per shard (1000 files x 32 MiB). 15 shards x 32000 MiB ~ 503 GB per node. A node that holds a full
  # rack replica of 250M partitions keeps 252 GB live (50%) and 287-303 GB in segments (57-60%)
  # (Argus 71b34d8b). SCYLLADB-6165 asks for 50-65%: 300M partitions would pass 65% in segments.
  logstor_disk_size_in_mb: 32000
  logstor_format_on_startup: true
  force_capacity_based_balancing: true
  enable_tablets: true
  tablets_mode_for_new_keyspaces: 'enabled'
  enable_file_stream: true


# Append --task-quota-ms 0.2 to existing append_scylla_args (++ prefix appends instead of replacing)
append_scylla_args: '++ --task-quota-ms 0.2'

use_mgmt: false
use_cloud_manager: false

