# Shrinks test-cases/features/strong-consistency/longevity-sc-verify-100gb-4h.yaml to a 5-minute check run of the
# cql-stress-sc-verify thread on AWS. Layer it after the test case; the job is
# jenkins-pipelines/oss/features/strong-consistency/longevity-sc-verify-check-5min.jenkinsfile.
#
# What survives: the thread end to end - profile upload, the setup guard, preload, the checked stream with the
# checker and read-back, the history copied back, and the event's severity. Not the scale or the nemesis.

# One node per rack keeps RF 3 with 3 racks; one loader means exactly one stress_cmd entry (the guard checks it).
n_db_nodes: 3
n_loaders: 1
instance_type_db: 'i4i.large'
instance_type_loader: 'i4i.large'
test_duration: 60
space_node_threshold: 0
user_prefix: 'sc-verify-check-5min'

# The default profile: 32 tablets and small rows. --check-age 1m checks rows within the 5-minute run.
prepare_write_cmd:
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-default.yaml --mode bulk --bulk-op write -n 100000
    --bulk-pop seq=1099511627776..1099511727775 --bulk-threads 8
stress_cmd:
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-default.yaml --mode both --pop seq=0..1023 --slots 8
    --bulk-op mixed --bulk-read-ratio 0.5 --bulk-pop seq=1099511627776..1099511727775 --bulk-threads 8 --bulk-rate 500
    --duration 5m --check-age 1m

nemesis_class_name: 'NoOpMonkey'
