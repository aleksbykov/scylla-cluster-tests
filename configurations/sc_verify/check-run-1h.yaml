# Shrinks test-cases/features/strong-consistency/longevity-sc-verify-100gb-4h.yaml to a 1-hour check run of the
# cql-stress-sc-verify thread on AWS. Layer it after the test case; the job is
# jenkins-pipelines/oss/features/strong-consistency/longevity-sc-verify-check-1h.jenkinsfile.
#
# What survives: the thread end to end - profile upload, the setup guard, preload, the checked stream with the
# checker and read-back, the history copied back, and the event's severity. Half the data set (~50 GB), no nemesis.

# 6 nodes in the test case's 3 racks: 2 per rack, as in the full job. Each loader runs exactly one prepare and one
# stress_cmd entry (round_robin), on its own --pop and --bulk-pop range (the guard checks it).
n_db_nodes: 6
n_loaders: 2
instance_type_db: 'i4i.4xlarge'
# x86_64: the sc-verify image is amd64 only. Run f2c00c14 used 6.7 of a c6i.2xlarge's 8 cores and ~3.4 Gbit/s each way,
# over its 3.125 Gbit/s baseline; the 4xlarge doubles both.
instance_type_loader: 'c6i.4xlarge'
test_duration: 180  # minutes: setup (~15) + 50 GB preload (up to ~60) + 60 load + up to 10 checker drain + read-back
space_node_threshold: 0
user_prefix: 'sc-verify-check-1h'

# The 4h job's profile: 128 tablets spread the Raft leaders over all shards (the default profile's 32 left 4-10 of
# 14 shards per node busy), and ~5 KB rows cost more CPU and IO per op. 2 x 5,242,880 rows of ~5 KB = ~50 GB, the 4h
# job's first loader range split in two; each loader's bulk mixed then works over its own half.
prepare_write_cmd:
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-100gb.yaml --mode bulk --bulk-op write -n 5242880
    --bulk-pop seq=1099511627776..1099516870655 --bulk-threads 256
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-100gb.yaml --mode bulk --bulk-op write -n 5242880
    --bulk-pop seq=1099516870656..1099522113535 --bulk-threads 256
# Checked ops/s per loader = --slots x --burst-ops per 1 s burst: 512 x 40 = ~20,480, the per-loader load of step S4
# of the 2026-10-08 saturation ramp (clean). 40 divides the 200-op row, so no burst is wasted. Bulk is unthrottled
# (--bulk-rate 0): 256 threads per loader as fast as the cluster answers.
stress_cmd:
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-100gb.yaml --mode both --pop seq=0..1023 --slots 512
    --burst-ops 40 --bulk-op mixed --bulk-read-ratio 0.5 --bulk-pop seq=1099511627776..1099516870655 --bulk-threads 256
    --bulk-rate 0 --duration 60m
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-100gb.yaml --mode both --pop seq=1024..2047 --slots 512
    --burst-ops 40 --bulk-op mixed --bulk-read-ratio 0.5 --bulk-pop seq=1099516870656..1099522113535 --bulk-threads 256
    --bulk-rate 0 --duration 60m

nemesis_class_name: 'NoOpMonkey'
