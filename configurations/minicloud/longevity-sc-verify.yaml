# Shrinks test-cases/features/strong-consistency/longevity-sc-verify-100gb-4h.yaml to a 5-minute check run under
# minicloud, for longevity_test.LongevityTest.test_custom_time. Layer all three, in this order:
#
#   -c test-cases/features/strong-consistency/longevity-sc-verify-100gb-4h.yaml \
#   -c configurations/minicloud/longevity-sc-verify.yaml \
#   -c configurations/minicloud.yaml
#
# What survives: the thread end to end - profile upload, the setup guard, preload, the checked stream with the
# checker and read-back, the history copied back, and the event's severity. Not the scale: no correctness or
# performance conclusions from a local run.
#
# Guest budget: 3 db + 1 loader = 4 guests x 4GiB (minicloud_lightweight_memory) = 16GiB, plus ~2GiB host headroom.

# One node per rack keeps RF 3 with 3 racks; one loader means exactly one stress_cmd entry (the guard checks it).
n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 0
instance_type_db: 'i4i.large'
instance_type_loader: 'i4i.large'
test_duration: 60
space_node_threshold: 0

# The default profile: 32 tablets and small rows. 128 tablets on 1-vCPU guests is the shape that crashed 2GB nodes.
# The checker gets 1 GiB of the loader's 4 GiB; --check-age 1m checks rows within the 5-minute run.
prepare_write_cmd:
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-default.yaml --mode bulk --bulk-op write -n 100000
    --bulk-pop seq=1099511627776..1099511727775 --bulk-threads 8
stress_cmd:
  - >-
    cql-stress-sc-verify --profile /tmp/sc-verify-profile-default.yaml --mode both --pop seq=0..1023 --slots 8
    --bulk-op mixed --bulk-read-ratio 0.5 --bulk-pop seq=1099511627776..1099511727775 --bulk-threads 8 --bulk-rate 500
    --duration 5m --checker-workers 1 --checker-mem 1G --check-age 1m

# minicloud has no disruptive node lifecycle; the nemesis path is not what this run checks.
nemesis_class_name: 'NoOpMonkey'
