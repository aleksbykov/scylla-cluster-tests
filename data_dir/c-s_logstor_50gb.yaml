# Logstor key-value table in the shape of the default cassandra-stress standard1 table
# (10-byte key, 5 x 34-byte columns), so the logstor 50GB longevity keeps the base job's dataset.
# min_tablet_count pins the tablet count, so topology changes only migrate tablets and never
# split or merge them (see configurations/logstor-longevity-50gb.yaml).
keyspace: keyspace1

keyspace_definition: |
  CREATE KEYSPACE IF NOT EXISTS keyspace1
  WITH REPLICATION = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3}
  AND tablets = {'enabled': true};

table: standard1

table_definition: |
  CREATE TABLE IF NOT EXISTS keyspace1.standard1 (
    key blob PRIMARY KEY,
    "C0" blob,
    "C1" blob,
    "C2" blob,
    "C3" blob,
    "C4" blob
  ) WITH storage_engine = 'logstor' AND tablets = {'min_tablet_count': 512};

columnspec:
  - name: key
    size: fixed(10)
  - name: C0
    size: fixed(34)
  - name: C1
    size: fixed(34)
  - name: C2
    size: fixed(34)
  - name: C3
    size: fixed(34)
  - name: C4
    size: fixed(34)

insert:
  partitions: fixed(1)
  select: fixed(1)/1
  batchtype: UNLOGGED

queries:
  write_row:
    cql: >-
      INSERT INTO keyspace1.standard1
      (key, "C0", "C1", "C2", "C3", "C4")
      VALUES (?, ?, ?, ?, ?, ?)
    fields: samerow
  read_row:
    cql: SELECT * FROM keyspace1.standard1 WHERE key = ?
    fields: samerow
